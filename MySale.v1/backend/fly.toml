app = "backend-morning-wildflower-3113"
primary_region = "iad"

[build]

[env]
  DATABASE_URL = "sqlite:////data/mysale.db"
  MYSALE_ENV = "production"

[mounts]
  source = "mysale_data"
  destination = "/data"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[vm]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
